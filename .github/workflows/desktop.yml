name: Release builds (macOS, Windows, Android)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          # Universal DMG (Apple Silicon + Intel) cross-built on an arm64 runner;
          # macos-13 Intel runners are deprecated and queue for a long time.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect changes since the previous release
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude="${GITHUB_REF_NAME}" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          {
            echo "body<<EOF"
            echo "## What changed${prev:+ since $prev}"
            git log --no-merges --pretty='- %s' $range | grep -viE '^- (Release [0-9]|Bump version|Fix .*test case$)' | awk '!seen[$0]++' | head -40
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # On a v* tag: attach installers to a draft GitHub Release
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('BTT Dive Planner {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ## Installers
            BTT Dive Planner – installers. The application UI is available in **Hungarian and English**.

            - **Windows 11:** `*-setup.exe` (recommended) or `*.msi`
            - **macOS:** `*_universal.dmg` for every Mac; `*_aarch64.dmg` for Apple Silicon only
            - **Android:** `*.apk` (arm64, sideload: allow “install unknown apps” for your browser or file manager)
            - **iOS:** not in the store yet; use the web app from Safari → Share → “Add to Home Screen”
            - **Web / PWA:** https://krisztianhari-wq.github.io/BTT-dive-planner/

            **macOS:** the app is not signed with an Apple developer certificate, so a downloaded copy is reported as “damaged”. Drag it to Applications, then run once in Terminal: `xattr -cr "/Applications/BTT Dive Planner.app"` – it opens normally afterwards.
            **Windows:** SmartScreen → “More info” → “Run anyway”.
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btt-dive-planner-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Generate the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android init
      - name: Build release APK (arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --target aarch64
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/sign-apk.sh
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: btt-dive-planner-android
          path: dist-android/*.apk
