name: Desktop builds (macOS, Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          # Universal DMG (Apple Silicon + Intel) cross-built on an arm64 runner;
          # macos-13 Intel runners are deprecated and queue for a long time.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # On a v* tag: attach installers to a draft GitHub Release
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('BTT Dive Planner {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            BTT Dive Planner – telepítők / installers

            - **Windows 11:** `*-setup.exe` (ajánlott) vagy `*.msi`
            - **macOS:** `*_universal.dmg` minden Macre; `*_aarch64.dmg` csak Apple Silicon
            - **Web / PWA:** https://krisztianhari-wq.github.io/BTT-dive-planner/

            Aláírás nélkül: macOS-en első indításkor jobb klikk → Megnyitás; Windowson SmartScreen → További információ → Futtatás mindenképpen.
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btt-dive-planner-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
